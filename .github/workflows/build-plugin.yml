name: Build SecRandom HideSecRandom Plugin

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build plugin
        run: dotnet build -c Release SecRandom.Plugin.HideSecRandom/SecRandom.Plugin.HideSecRandom.csproj

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-srpx
          path: SecRandom.Plugin.HideSecRandom/srpx/*.srpx
          if-no-files-found: error

  release-build:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build plugin
        run: dotnet build -c Release SecRandom.Plugin.HideSecRandom/SecRandom.Plugin.HideSecRandom.csproj

      - name: Upload plugin to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SecRandom.Plugin.HideSecRandom/srpx/*.srpx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
